workflows:
  csx-lab:
    name: CSX macOS lab
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      vars:
        LANG: en_US.UTF-8
    scripts:
      - name: Run CleanShot probe
        script: |
          chmod +x scripts/csx_probe_v14.sh
          bash scripts/csx_probe_v14.sh
    artifacts:
      - /tmp/csx-report-v14.txt
    publishing:
      email:
        recipients:
          - jepehauto@gmail.com
        notify:
          success: true
          failure: true
